
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>匿名建议箱管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f3f4f7;color:#1c1c1e}
.shell{max-width:1180px;margin:auto;padding:40px 24px 60px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}
.top h1{margin:0 0 6px;font-size:30px}.top p{margin:0;color:#888;font-size:14px}
.btn,.filter,.send{border:0;font:inherit;cursor:pointer}
.btn{padding:11px 15px;border-radius:14px;background:#fff;box-shadow:0 8px 24px #00000010;font-weight:650}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filter{padding:9px 14px;border-radius:999px;background:#fff;color:#68686f;font-size:13px;font-weight:650}
.filter.active{background:#1c1c1e;color:#fff}
.layout{display:grid;grid-template-columns:minmax(310px,420px) minmax(0,1fr);gap:18px}
.glass{background:#fffffff0;border:1px solid #fff;border-radius:24px;box-shadow:0 16px 44px #303a4c12}
.list{overflow:hidden;min-height:580px}.listHead{padding:18px 18px 12px;font-size:12px;color:#8e8e93;font-weight:650}.items{padding:0 10px 12px}
.item{padding:14px 12px;border-radius:16px;cursor:pointer}.item:hover,.item.active{background:#f2f2f7}.item+.item{margin-top:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font-size:14px;font-weight:750}
.status{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}.submitted{background:#fff1ce;color:#8a6210}.viewed{background:#e4f2ff;color:#1d5f9e}.replied{background:#e5f7e9;color:#21833b}
.preview{margin-top:7px;font-size:13px;color:#515158;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-top:7px;font-size:11px;color:#999}
.detail{min-height:580px;padding:22px}.empty{display:grid;place-items:center;min-height:520px;color:#999;text-align:center}
.detailTop{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.detailCode{font-size:21px;font-weight:760}
.card{border-radius:18px;padding:16px;background:#f7f7fa;margin-bottom:12px}.label{font-size:12px;font-weight:680;color:#8e8e93;margin-bottom:9px}
.content{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in}
.replyBox{width:100%;min-height:120px;border:0;outline:0;resize:vertical;background:#f7f7fa;border-radius:16px;padding:14px;font:inherit;line-height:1.6}
.replyActions{display:flex;justify-content:flex-end;margin-top:10px}.send{border-radius:13px;background:#007aff;color:#fff;padding:10px 16px;font-weight:700}.send:disabled,.btn:disabled{opacity:.55}
.error{margin:16px;padding:16px;border-radius:16px;background:#fff1f0;color:#b42318;font-size:13px;line-height:1.55}
@media(max-width:800px){.shell{padding:24px 14px 40px}.layout{grid-template-columns:1fr}.list{min-height:0}.detail{min-height:480px}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="shell">
<header class="top">
  <div><h1>匿名建议箱</h1><p>查看和回复收到的匿名建议。</p></div>
  <button class="btn" id="refreshButton" type="button">刷新</button>
</header>
<nav class="toolbar" id="filters">
  <button class="filter active" data-filter="all" type="button">全部</button>
  <button class="filter" data-filter="submitted" type="button">未查看</button>
  <button class="filter" data-filter="viewed" type="button">已查看</button>
  <button class="filter" data-filter="replied" type="button">已回复</button>
</nav>
<section class="layout">
  <div class="glass list">
    <div class="listHead" id="listTitle">反馈列表</div>
    <div class="items" id="feedbackList"><div class="empty">正在加载……</div></div>
  </div>
  <div class="glass detail" id="detailPanel"><div class="empty">选择一条反馈查看详情。</div></div>
</section>
</main>
<script>
const ENDPOINT = 'https://hxydriuultrkgrhnhusy.supabase.co/functions/v1/anonymous-feedback';
const TOKEN_KEY = 'tonghuaji_feedback_admin_key';
let adminToken = '';
let allFeedbacks = [];
let currentFilter = 'all';
let currentCode = '';

const esc = value => String(value ?? '')
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#039;');

function fmt(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('zh-CN', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).format(date);
}

function statusInfo(value) {
  if (value === 'replied') return { text: '已回复', cls: 'replied' };
  if (value === 'viewed') return { text: '已查看', cls: 'viewed' };
  return { text: '未查看', cls: 'submitted' };
}

function readToken() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get('key');
  if (fromUrl) {
    localStorage.setItem(TOKEN_KEY, fromUrl);
    history.replaceState(null, '', location.pathname);
    return fromUrl;
  }
  return localStorage.getItem(TOKEN_KEY) || '';
}

async function api(action, body = {}) {
  const response = await fetch(ENDPOINT, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-admin-token': adminToken
    },
    cache: 'no-store',
    body: JSON.stringify({ action, ...body })
  });
  const payload = await response.json().catch(() => null);
  if (!response.ok) throw new Error(payload?.error || '请求失败');
  return payload?.data;
}

function showFatal(message) {
  document.getElementById('feedbackList').innerHTML = `<div class="error">${esc(message)}</div>`;
  document.getElementById('detailPanel').innerHTML = '<div class="empty">管理链接无效或已失效。</div>';
}

function setFilter(value) {
  currentFilter = value;
  document.querySelectorAll('.filter').forEach(button => {
    button.classList.toggle('active', button.dataset.filter === value);
  });
  renderList();
}

function renderList() {
  const list = document.getElementById('feedbackList');
  const items = currentFilter === 'all'
    ? allFeedbacks
    : allFeedbacks.filter(item => item.status === currentFilter);

  document.getElementById('listTitle').textContent = `反馈列表 · ${items.length}`;

  if (!items.length) {
    list.innerHTML = '<div class="empty">这里暂时没有反馈。</div>';
    return;
  }

  list.innerHTML = items.map(item => {
    const status = statusInfo(item.status);
    return `
      <article class="item ${item.public_code === currentCode ? 'active' : ''}" data-code="${esc(item.public_code)}">
        <div class="row">
          <span class="code">${esc(item.public_code)}</span>
          <span class="status ${status.cls}">${status.text}</span>
        </div>
        <div class="preview">${esc(item.content)}</div>
        <div class="time">${esc(fmt(item.created_at))}</div>
      </article>
    `;
  }).join('');
}

async function loadFeedbacks() {
  const button = document.getElementById('refreshButton');
  button.disabled = true;
  try {
    allFeedbacks = await api('admin-list') || [];
    renderList();
    if (currentCode && allFeedbacks.some(item => item.public_code === currentCode)) {
      await openDetail(currentCode, false);
    }
  } catch (error) {
    showFatal(error?.message || '读取失败');
  } finally {
    button.disabled = false;
  }
}

async function openDetail(code, rerender = true) {
  currentCode = String(code || '');
  if (rerender) renderList();

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = '<div class="empty">正在读取……</div>';

  try {
    const item = await api('admin-detail', { publicCode: currentCode });
    const status = statusInfo(item.status);
    const screenshots = Array.isArray(item.screenshots) ? item.screenshots : [];

    panel.innerHTML = `
      <div class="detailTop">
        <div>
          <div class="detailCode">${esc(item.public_code)}</div>
          <div class="time">${esc(fmt(item.created_at))}</div>
        </div>
        <span class="status ${status.cls}">${status.text}</span>
      </div>
      <div class="card">
        <div class="label">反馈内容</div>
        <div class="content">${esc(item.content)}</div>
        ${screenshots.length ? `<div class="shots">${screenshots.map((src, index) =>
          `<img src="${src}" alt="截图 ${index + 1}" data-shot="1">`
        ).join('')}</div>` : ''}
      </div>
      <div class="label" style="margin:18px 2px 8px">回复</div>
      <textarea class="replyBox" id="replyInput" maxlength="4000" placeholder="写下回复……">${esc(item.admin_reply || '')}</textarea>
      <div class="replyActions"><button class="send" id="sendReply" type="button">发送回复</button></div>
    `;

    const index = allFeedbacks.findIndex(row => row.public_code === currentCode);
    if (index >= 0) {
      allFeedbacks[index] = { ...allFeedbacks[index], ...item };
      renderList();
    }
  } catch (error) {
    panel.innerHTML = `<div class="error">${esc(error?.message || '读取失败')}</div>`;
  }
}

async function sendReply() {
  const input = document.getElementById('replyInput');
  const button = document.getElementById('sendReply');
  const reply = String(input?.value || '').trim();
  if (!reply) {
    input?.focus();
    return;
  }

  button.disabled = true;
  button.textContent = '发送中…';

  try {
    const item = await api('admin-reply', { publicCode: currentCode, reply });
    const index = allFeedbacks.findIndex(row => row.public_code === currentCode);
    if (index >= 0) allFeedbacks[index] = { ...allFeedbacks[index], ...item };
    renderList();
    await openDetail(currentCode, false);
  } catch (error) {
    alert(error?.message || '回复失败');
  } finally {
    button.disabled = false;
    button.textContent = '发送回复';
  }
}

document.getElementById('refreshButton').addEventListener('click', loadFeedbacks);

document.getElementById('filters').addEventListener('click', event => {
  const button = event.target.closest('[data-filter]');
  if (button) setFilter(button.dataset.filter);
});

document.getElementById('feedbackList').addEventListener('click', event => {
  const item = event.target.closest('[data-code]');
  if (item) openDetail(item.dataset.code);
});

document.getElementById('detailPanel').addEventListener('click', event => {
  const image = event.target.closest('[data-shot]');
  if (image) {
    window.open(image.src, '_blank', 'noopener,noreferrer');
    return;
  }
  if (event.target.closest('#sendReply')) sendReply();
});

adminToken = readToken();
if (!adminToken) {
  showFatal('这个管理链接缺少访问凭证。');
} else {
  loadFeedbacks();
}
</script>
</body>
</html>
