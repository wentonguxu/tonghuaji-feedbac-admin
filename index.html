
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>匿名建议箱管理</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f3f4f7;color:#1c1c1e}.shell{max-width:1180px;margin:auto;padding:40px 24px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:20px}.top h1{margin:0 0 6px;font-size:30px}.top p{margin:0;color:#888;font-size:14px}.btn,.filter,.send{border:0;font:inherit;cursor:pointer}.btn{padding:11px 15px;border-radius:14px;background:#fff;box-shadow:0 8px 24px #00000010;font-weight:650}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{padding:9px 14px;border-radius:999px;background:#fff;color:#68686f;font-size:13px;font-weight:650}.filter.active{background:#1c1c1e;color:#fff}.layout{display:grid;grid-template-columns:minmax(310px,420px) minmax(0,1fr);gap:18px}.glass{background:#fffffff0;border:1px solid #fff;border-radius:24px;box-shadow:0 16px 44px #303a4c12}.list{overflow:hidden;min-height:580px}.listHead{padding:18px 18px 12px;font-size:12px;color:#8e8e93;font-weight:650}.items{padding:0 10px 12px}.item{padding:14px 12px;border-radius:16px;cursor:pointer}.item:hover,.item.active{background:#f2f2f7}.item+.item{margin-top:4px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.code{font-size:14px;font-weight:750}.status{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px}.submitted{background:#fff1ce;color:#8a6210}.viewed{background:#e4f2ff;color:#1d5f9e}.replied{background:#e5f7e9;color:#21833b}.preview{margin-top:7px;font-size:13px;color:#515158;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{margin-top:7px;font-size:11px;color:#999}.detail{min-height:580px;padding:22px}.empty{display:grid;place-items:center;min-height:520px;color:#999;text-align:center}.detailTop{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.detailCode{font-size:21px;font-weight:760}.card{border-radius:18px;padding:16px;background:#f7f7fa;margin-bottom:12px}.label{font-size:12px;font-weight:680;color:#8e8e93;margin-bottom:9px}.content{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.shots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in}.replyBox{width:100%;min-height:120px;border:0;outline:0;resize:vertical;background:#f7f7fa;border-radius:16px;padding:14px;font:inherit;line-height:1.6}.replyActions{display:flex;justify-content:flex-end;margin-top:10px}.send{border-radius:13px;background:#007aff;color:#fff;padding:10px 16px;font-weight:700}.send:disabled,.btn:disabled{opacity:.55}.error{margin:16px;padding:16px;border-radius:16px;background:#fff1f0;color:#b42318;font-size:13px;line-height:1.55}@media(max-width:800px){.shell{padding:24px 14px 40px}.layout{grid-template-columns:1fr}.list{min-height:0}.detail{min-height:480px}.shots{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="shell"><header class="top"><div><h1>匿名建议箱</h1><p>查看和回复收到的匿名建议。</p></div><button class="btn" id="refreshButton" onclick="loadFeedbacks()">刷新</button></header><nav class="toolbar"><button class="filter active" data-filter="all" onclick="setFilter('all')">全部</button><button class="filter" data-filter="submitted" onclick="setFilter('submitted')">未查看</button><button class="filter" data-filter="viewed" onclick="setFilter('viewed')">已查看</button><button class="filter" data-filter="replied" onclick="setFilter('replied')">已回复</button></nav><section class="layout"><div class="glass list"><div class="listHead" id="listTitle">反馈列表</div><div class="items" id="feedbackList"><div class="empty">正在加载……</div></div></div><div class="glass detail" id="detailPanel"><div class="empty">选择一条反馈查看详情。</div></div></section></main>
<script>
const ENDPOINT='https://hxydriuultrkgrhnhusy.supabase.co/functions/v1/anonymous-feedback';let adminToken='',allFeedbacks=[],currentFilter='all',currentCode='';
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function stat(v){if(v==='replied')return{t:'已回复',c:'replied'};if(v==='viewed')return{t:'已查看',c:'viewed'};return{t:'未查看',c:'submitted'}}
function readToken(){const q=new URLSearchParams(location.search),k=q.get('key');if(k){sessionStorage.setItem('tonghuaji_feedback_admin_key',k);history.replaceState(null,'',location.pathname);return k}return sessionStorage.getItem('tonghuaji_feedback_admin_key')||''}
async function api(action,body={}){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':adminToken},cache:'no-store',body:JSON.stringify({action,...body})});const p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.error||'请求失败');return p?.data}
function showFatal(m){document.getElementById('feedbackList').innerHTML='<div class="error">'+esc(m)+'</div>';document.getElementById('detailPanel').innerHTML='<div class="empty">管理链接无效或已失效。</div>'}
function setFilter(v){currentFilter=v;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===v));renderList()}
function renderList(){const list=document.getElementById('feedbackList'),items=currentFilter==='all'?allFeedbacks:allFeedbacks.filter(x=>x.status===currentFilter);document.getElementById('listTitle').textContent='反馈列表 · '+items.length;if(!items.length){list.innerHTML='<div class="empty">这里暂时没有反馈。</div>';return}list.innerHTML=items.map(item=>{const s=stat(item.status);return '<article class="item '+(item.public_code===currentCode?'active':'')+'" onclick="openDetail(\\''+esc(item.public_code)+'\\')"><div class="row"><span class="code">'+esc(item.public_code)+'</span><span class="status '+s.c+'">'+s.t+'</span></div><div class="preview">'+esc(item.content)+'</div><div class="time">'+esc(fmt(item.created_at))+'</div></article>'}).join('')}
async function loadFeedbacks(){const b=document.getElementById('refreshButton');b.disabled=true;try{allFeedbacks=await api('admin-list')||[];renderList();if(currentCode&&allFeedbacks.some(x=>x.public_code===currentCode))await openDetail(currentCode,false)}catch(e){showFatal(e.message||'读取失败')}finally{b.disabled=false}}
async function openDetail(code,rerender=true){currentCode=code;if(rerender)renderList();const p=document.getElementById('detailPanel');p.innerHTML='<div class="empty">正在读取……</div>';try{const item=await api('admin-detail',{publicCode:code}),s=stat(item.status),shots=Array.isArray(item.screenshots)?item.screenshots:[];p.innerHTML='<div class="detailTop"><div><div class="detailCode">'+esc(item.public_code)+'</div><div class="time">'+esc(fmt(item.created_at))+'</div></div><span class="status '+s.c+'">'+s.t+'</span></div><div class="card"><div class="label">反馈内容</div><div class="content">'+esc(item.content)+'</div>'+(shots.length?'<div class="shots">'+shots.map((src,i)=>'<img src="'+src+'" alt="截图 '+(i+1)+'" onclick="window.open(this.src,\\'_blank\\')">').join('')+'</div>':'')+'</div><div class="label" style="margin:18px 2px 8px">回复</div><textarea class="replyBox" id="replyInput" maxlength="4000" placeholder="写下回复……">'+esc(item.admin_reply||'')+'</textarea><div class="replyActions"><button class="send" id="sendReply" onclick="sendReply()">发送回复</button></div>';const i=allFeedbacks.findIndex(x=>x.public_code===code);if(i>=0){allFeedbacks[i]={...allFeedbacks[i],...item};renderList()}}catch(e){p.innerHTML='<div class="error">'+esc(e.message||'读取失败')+'</div>'}}
async function sendReply(){const input=document.getElementById('replyInput'),b=document.getElementById('sendReply'),reply=String(input?.value||'').trim();if(!reply){input?.focus();return}b.disabled=true;b.textContent='发送中…';try{const item=await api('admin-reply',{publicCode:currentCode,reply}),i=allFeedbacks.findIndex(x=>x.public_code===currentCode);if(i>=0)allFeedbacks[i]={...allFeedbacks[i],...item};renderList();await openDetail(currentCode,false)}catch(e){alert(e.message||'回复失败')}finally{b.disabled=false;b.textContent='发送回复'}}
adminToken=readToken();if(!adminToken)showFatal('这个管理链接缺少访问凭证。');else loadFeedbacks();
</script></body></html>
